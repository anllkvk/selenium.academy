[pytest]
# Test dosyalarının bulunduğu klasör
testpaths = tests

# Test dosyası / sınıf / fonksiyon isim kalıpları
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Çıktı ayarları: -v ayrıntılı, -s print'leri göster
addopts = -v --tb=short

# Özel işaretler (marker) — testleri gruplamak için
markers =
    smoke: Hızlı temel testler
    webdriver: WebDriver / sürücü ve options dersleri
    elementler: Element bulma / locator dersleri
    crossbrowser: Birden fazla tarayıcıda çalışan testler
    cookies: Cookie yönetimi dersleri
    screenshot: Ekran görüntüsü dersleri
    pom: Page Object Model dersleri
